services:

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/jobportal
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8

volumes:
  mongodb_data: